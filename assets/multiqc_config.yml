report_comment: >
  This report was generated by <a href="https://github.com/alexyfyf/atac_nf" target="_blank">atac_nf</a>.

report_section_order:
  atac_library_complexity:
    order: -1000
  atac_frip:
    order: -1100

export_plots: true

# Raw and trimmed FastQC are distinguished by the ext.prefix set in conf/modules.config
# (`<sample>_raw` vs `<sample>_trimmed`), so both appear as separate rows rather than
# overwriting each other.
extra_fn_clean_exts:
  - "_sorted"
  - "_shifted_sorted"
  - ".filtered"
  - "_sorted_mdups"

table_columns_visible:
  FastQC:
    percent_duplicates: true
    percent_gc: true
